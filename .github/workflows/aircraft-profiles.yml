name: Refresh aircraft profiles

# Re-runs the profile generator against the MobiFlight HubHop community
# database and opens a pull request when it produces something new. HubHop
# gains variables for new add-ons continuously, so this is how the shipped
# profiles keep up without anyone remembering to look.
#
# Only drafts still carrying the "x-generated" marker are rewritten. Deleting
# that marker from a profile adopts it: the generator then leaves it alone, so
# a correction made after flying the aircraft is never overwritten.

on:
  schedule:
    # Mondays at 04:00 UTC, before the week starts.
    - cron: "0 4 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: aircraft-profiles
  cancel-in-progress: false

jobs:
  refresh:
    name: Regenerate from HubHop
    runs-on: ubicloud-standard-2
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Regenerate profiles
        run: |
          go run ./cmd/hubhop gen -sim msfs
          go run ./cmd/hubhop gen -sim xplane

      - name: Check for changes
        id: diff
        run: |
          if git diff --quiet -- internal/profiles/builtin; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "HubHop has nothing new for the shipped profiles."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git diff --stat -- internal/profiles/builtin
          fi

      # Every generated profile is parsed and validated by the profile tests,
      # which also assert that no data point is left bound to a variable the
      # adapters cannot read. A pull request opened with GITHUB_TOKEN does not
      # start another workflow run, so the gate has to run here.
      - name: Validate the generated profiles
        if: steps.diff.outputs.changed == 'true'
        run: go test ./internal/profiles/...

      - name: Open or update the pull request
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          BRANCH=automation/aircraft-profiles

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$BRANCH"
          git add internal/profiles/builtin
          git commit \
            -m "Refresh aircraft profiles from HubHop" \
            -m "Regenerated by .github/workflows/aircraft-profiles.yml. Drafts carry the x-generated marker and have not been confirmed in the simulator; delete the marker from a profile to adopt it and stop the generator rewriting it."

          # The branch belongs to this workflow alone and is rebuilt from the
          # default branch every run, so it is always force-pushed. --force-with-lease
          # would need the remote ref fetched first, which the checkout above skips.
          git push --force origin "$BRANCH"

          if [ -z "$(gh pr list --head "$BRANCH" --state open --json number --jq '.[].number')" ]; then
            gh pr create \
              --base "${{ github.event.repository.default_branch }}" \
              --head "$BRANCH" \
              --title "Refresh aircraft profiles from HubHop" \
              --body "$(cat <<'BODY'
          Automated refresh of the generated aircraft profiles from the
          [MobiFlight HubHop](https://hubhop.mobiflight.com) community database.

          Every profile here carries `"x-generated": true`, which means the
          selector and the bindings were derived from HubHop labels and have
          **not** been confirmed in the simulator. They are shipped at a low
          priority and every binding falls back to the stock variable, so a
          wrong aircraft variable costs nothing until someone flies it.

          To adopt one: correct it, then delete its `x-generated` marker. The
          generator leaves adopted profiles alone from then on.

          See [docs/aircraft-profiles.md](docs/aircraft-profiles.md).
          BODY
          )"
          else
            echo "The rolling pull request for $BRANCH already exists and now carries the new commit."
          fi
