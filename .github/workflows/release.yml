name: Release

on:
  push:
    branches:
      - production
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubicloud-standard-2
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: Install Wails CLI
        # Pinned to the wails/v3 version in go.mod: @latest broke the Linux
        # jobs when newer alphas switched to GTK4/webkitgtk-6.0, which the
        # apt packages above don't provide. Bump together with go.mod.
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0-alpha.72

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Determine version
        id: version
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "$REF_NAME" = "production" ]; then
            VERSION="1.$(date +%Y%m%d).${GITHUB_RUN_NUMBER}"
            PRERELEASE=false
            TAG="v${VERSION}"
          else
            SHORT_SHA="${GITHUB_SHA::7}"
            VERSION="0.$(date +%Y%m%d).${GITHUB_RUN_NUMBER}-beta.${SHORT_SHA}"
            PRERELEASE=true
            TAG="v${VERSION}"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "prerelease=${PRERELEASE}" >> "$GITHUB_OUTPUT"

      - name: Generate bindings
        run: wails3 generate bindings -f '-tags production -trimpath -buildvcs=false' -clean=true -ts

      - name: Build frontend
        run: npm run build
        working-directory: frontend

      - name: Generate icons
        run: wails3 generate icons -input appicon.png -windowsfilename windows/icon.ico
        working-directory: build

      - name: Generate syso
        run: wails3 generate syso -arch amd64 -icon windows/icon.ico -manifest windows/wails.exe.manifest -info windows/info.json -out ../wails_windows_amd64.syso
        working-directory: build

      - name: Build Windows exe
        run: |
          mkdir -p bin
          go build -tags production -trimpath -buildvcs=false \
            -ldflags="-w -s -H windowsgui -X airspace-acars/internal/domain.Version=${{ steps.version.outputs.version }}" \
            -o bin/airspace-acars-windows-amd64.exe
        env:
          GOOS: windows
          GOARCH: amd64
          CGO_ENABLED: "0"

      - name: Clean up syso
        run: rm -f *.syso

      - name: Bundle SimConnect DLL
        run: cp SimConnect.dll bin/SimConnect.dll

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: |
            bin/airspace-acars-windows-amd64.exe
            bin/SimConnect.dll

  build-linux:
    runs-on: ubicloud-standard-2
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: Install nfpm
        run: go install github.com/goreleaser/nfpm/v2/cmd/nfpm@latest

      - name: Install Wails CLI
        # Pinned to the wails/v3 version in go.mod: @latest broke the Linux
        # jobs when newer alphas switched to GTK4/webkitgtk-6.0, which the
        # apt packages above don't provide. Bump together with go.mod.
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0-alpha.72

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Determine version
        id: version
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "$REF_NAME" = "production" ]; then
            VERSION="1.$(date +%Y%m%d).${GITHUB_RUN_NUMBER}"
          else
            SHORT_SHA="${GITHUB_SHA::7}"
            VERSION="0.$(date +%Y%m%d).${GITHUB_RUN_NUMBER}-beta.${SHORT_SHA}"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Generate bindings
        run: wails3 generate bindings -f '-tags production -trimpath -buildvcs=false' -clean=true -ts

      - name: Build frontend
        run: npm run build
        working-directory: frontend

      - name: Build Linux binary
        run: |
          mkdir -p bin
          go build -tags production -trimpath -buildvcs=false \
            -ldflags="-w -s -X airspace-acars/internal/domain.Version=${{ steps.version.outputs.version }}" \
            -o bin/airspace-acars-linux-amd64
        env:
          CGO_ENABLED: "1"

      - name: Generate desktop file
        run: wails3 generate .desktop -name "airspace-acars" -exec "airspace-acars" -icon "airspace-acars" -outputfile "build/linux/airspace-acars.desktop" -categories "Development;"

      - name: Package deb and rpm
        run: |
          VERSION=${{ steps.version.outputs.version }} nfpm package -p deb -f build/linux/nfpm/nfpm.yaml -t bin/
          VERSION=${{ steps.version.outputs.version }} nfpm package -p rpm -f build/linux/nfpm/nfpm.yaml -t bin/

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-linux-output
          path: |
            bin/airspace-acars-linux-amd64
            bin/*.deb
            bin/*.rpm

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Wails CLI
        # Pinned to the wails/v3 version in go.mod: @latest broke the Linux
        # jobs when newer alphas switched to GTK4/webkitgtk-6.0, which the
        # apt packages above don't provide. Bump together with go.mod.
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0-alpha.72

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Determine version
        id: version
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "$REF_NAME" = "production" ]; then
            VERSION="1.$(date +%Y%m%d).${GITHUB_RUN_NUMBER}"
          else
            SHORT_SHA="${GITHUB_SHA::7}"
            VERSION="0.$(date +%Y%m%d).${GITHUB_RUN_NUMBER}-beta.${SHORT_SHA}"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Generate bindings
        run: wails3 generate bindings -f '-tags production -trimpath -buildvcs=false' -clean=true -ts

      - name: Build frontend
        run: npm run build
        working-directory: frontend

      - name: Build macOS arm64 binary
        run: |
          mkdir -p bin
          go build -tags production -trimpath -buildvcs=false \
            -ldflags="-w -s -X airspace-acars/internal/domain.Version=${{ steps.version.outputs.version }}" \
            -o bin/airspace-acars-darwin-arm64
        env:
          CGO_ENABLED: "1"
          GOOS: darwin
          GOARCH: arm64

      - name: Build macOS amd64 binary
        run: |
          go build -tags production -trimpath -buildvcs=false \
            -ldflags="-w -s -X airspace-acars/internal/domain.Version=${{ steps.version.outputs.version }}" \
            -o bin/airspace-acars-darwin-amd64
        env:
          CGO_ENABLED: "1"
          GOOS: darwin
          GOARCH: amd64

      - name: Create universal binary
        run: |
          lipo -create -output bin/airspace-acars \
            bin/airspace-acars-darwin-arm64 \
            bin/airspace-acars-darwin-amd64
          rm bin/airspace-acars-darwin-arm64 bin/airspace-acars-darwin-amd64

      - name: Generate icons
        run: wails3 generate icons -input build/appicon.png -macfilename build/darwin/icons.icns

      - name: Rename universal binary for release
        run: cp bin/airspace-acars bin/airspace-acars-darwin-universal

      - name: Import signing certificate
        id: cert
        env:
          APPLE_CERTIFICATE_P12: ${{ secrets.APPLE_CERTIFICATE_P12 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          KEYCHAIN_PASSWORD=$(openssl rand -base64 24)
          KEYCHAIN_PATH="$RUNNER_TEMP/build.keychain-db"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          printf '%s' "$APPLE_CERTIFICATE_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN_PATH" \
            -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          rm -f "$RUNNER_TEMP/cert.p12"
          security set-key-partition-list -S apple-tool:,apple: -s \
            -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH" > /dev/null
          security list-keychains -d user -s "$KEYCHAIN_PATH" login.keychain-db
          IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" \
            | awk -F'"' '/Developer ID Application/ {print $2; exit}')
          if [ -z "$IDENTITY" ]; then
            echo "No Developer ID Application identity found in certificate" >&2
            exit 1
          fi
          echo "identity=$IDENTITY" >> "$GITHUB_OUTPUT"

      - name: Create .app bundle
        run: |
          APP="bin/Airspace ACARS.app"
          mkdir -p "$APP/Contents/MacOS"
          mkdir -p "$APP/Contents/Resources"
          cp bin/airspace-acars "$APP/Contents/MacOS/airspace-acars"
          cp build/darwin/icons.icns "$APP/Contents/Resources/"
          if [ -f build/darwin/Assets.car ]; then
            cp build/darwin/Assets.car "$APP/Contents/Resources/"
          fi
          # Write Info.plist with correct version
          sed "s/0.1.0/${{ steps.version.outputs.version }}/g" \
            build/darwin/Info.plist > "$APP/Contents/Info.plist"

      - name: Sign binaries
        env:
          IDENTITY: ${{ steps.cert.outputs.identity }}
        run: |
          codesign --force --options runtime --timestamp \
            --entitlements build/darwin/entitlements.plist \
            --sign "$IDENTITY" "bin/Airspace ACARS.app"
          codesign --force --options runtime --timestamp \
            --entitlements build/darwin/entitlements.plist \
            --sign "$IDENTITY" bin/airspace-acars-darwin-universal
          codesign --verify --strict --verbose=2 "bin/Airspace ACARS.app"

      - name: Notarize and staple .app
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: |
          printf '%s\n' "$APPLE_API_KEY_P8" > "$RUNNER_TEMP/AuthKey.p8"
          ditto -c -k --keepParent "bin/Airspace ACARS.app" "$RUNNER_TEMP/app.zip"
          xcrun notarytool submit "$RUNNER_TEMP/app.zip" \
            --key "$RUNNER_TEMP/AuthKey.p8" \
            --key-id "$APPLE_API_KEY_ID" \
            --issuer "$APPLE_API_ISSUER_ID" \
            --wait --output-format json | tee "$RUNNER_TEMP/notary-app.json"
          STATUS=$(jq -r '.status' "$RUNNER_TEMP/notary-app.json")
          if [ "$STATUS" != "Accepted" ]; then
            SUBMISSION_ID=$(jq -r '.id' "$RUNNER_TEMP/notary-app.json")
            xcrun notarytool log "$SUBMISSION_ID" \
              --key "$RUNNER_TEMP/AuthKey.p8" \
              --key-id "$APPLE_API_KEY_ID" \
              --issuer "$APPLE_API_ISSUER_ID"
            exit 1
          fi
          xcrun stapler staple "bin/Airspace ACARS.app"

      - name: Create .dmg
        run: |
          # Create a temporary directory for DMG contents
          DMG_DIR=$(mktemp -d)
          cp -R "bin/Airspace ACARS.app" "$DMG_DIR/"
          ln -s /Applications "$DMG_DIR/Applications"
          hdiutil create -volname "Airspace ACARS" \
            -srcfolder "$DMG_DIR" \
            -ov -format UDZO \
            "bin/airspace-acars-darwin-universal.dmg"
          rm -rf "$DMG_DIR"

      - name: Sign, notarize and staple .dmg
        env:
          IDENTITY: ${{ steps.cert.outputs.identity }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: |
          codesign --force --timestamp --sign "$IDENTITY" \
            bin/airspace-acars-darwin-universal.dmg
          xcrun notarytool submit bin/airspace-acars-darwin-universal.dmg \
            --key "$RUNNER_TEMP/AuthKey.p8" \
            --key-id "$APPLE_API_KEY_ID" \
            --issuer "$APPLE_API_ISSUER_ID" \
            --wait --output-format json | tee "$RUNNER_TEMP/notary-dmg.json"
          STATUS=$(jq -r '.status' "$RUNNER_TEMP/notary-dmg.json")
          if [ "$STATUS" != "Accepted" ]; then
            SUBMISSION_ID=$(jq -r '.id' "$RUNNER_TEMP/notary-dmg.json")
            xcrun notarytool log "$SUBMISSION_ID" \
              --key "$RUNNER_TEMP/AuthKey.p8" \
              --key-id "$APPLE_API_KEY_ID" \
              --issuer "$APPLE_API_ISSUER_ID"
            exit 1
          fi
          xcrun stapler staple bin/airspace-acars-darwin-universal.dmg
          xcrun stapler validate bin/airspace-acars-darwin-universal.dmg

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-macos-output
          path: |
            bin/airspace-acars-darwin-universal.dmg
            bin/airspace-acars-darwin-universal

      - name: Clean up signing material
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/build.keychain-db" || true
          rm -f "$RUNNER_TEMP/AuthKey.p8" "$RUNNER_TEMP/cert.p12"

  release:
    runs-on: windows-latest
    needs: [build, build-linux, build-macos]
    steps:
      - uses: actions/checkout@v4

      - name: Download Windows build artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-output
          path: bin

      - name: Download Linux build artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-linux-output
          path: bin

      - name: Download macOS build artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-macos-output
          path: bin

      - name: Prepare installer
        shell: pwsh
        run: |
          Copy-Item "bin\airspace-acars-windows-amd64.exe" "Airspace ACARS.exe"
          Copy-Item "bin\SimConnect.dll" "SimConnect.dll"
          $version = "${{ needs.build.outputs.version }}"
          (Get-Content "installer.iss" -Raw) -replace '__VERSION__', $version |
            Set-Content "installer.iss" -NoNewline

      - name: Build installer
        shell: pwsh
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer.iss

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ needs.build.outputs.tag }}
          name: ${{ needs.build.outputs.prerelease == 'true' && format('Beta {0}', needs.build.outputs.version) || needs.build.outputs.version }}
          prerelease: ${{ needs.build.outputs.prerelease }}
          generate_release_notes: true
          files: |
            bin/airspace-acars-windows-amd64.exe
            bin/airspace-acars-windows-amd64-setup.exe
            bin/airspace-acars-linux-amd64
            bin/airspace-acars-darwin-universal
            bin/airspace-acars-darwin-universal.dmg
            bin/airspace-acars*.deb
            bin/airspace-acars*.rpm
